<html>
  <head>
    <title>Coach</title>
    <script
      language="JavaScript"
      type="text/javascript"
      src="elizabot.js"
    ></script>
    <script
      language="JavaScript"
      type="text/javascript"
      src="elizadata.js"
    ></script>

    <script language="JavaScript" type="text/javascript">
      <!--

      var eliza = new ElizaBot();
      var elizaLines = new Array();

      var displayCols = 60;
      var displayRows = 20;

      function elizaReset() {
        eliza.reset();
        elizaLines.length = 0;
        elizaStep();
      }

      function elizaStep() {
        var f = document.forms.e_form;
        var userinput = f.e_input.value;
        if (eliza.quit) {
          f.e_input.value = "";
          if (confirm("This session is over.\nStart over?")) elizaReset();
          f.e_input.focus();
          return;
        } else if (userinput != "") {
          var usr = "You:   " + userinput;
          var rpl = "Coach Creed: " + eliza.transform(userinput);
          elizaLines.push(usr);
          elizaLines.push(rpl);
          // display nicely
          // (fit to textarea with last line free - reserved for extra line caused by word wrap)
          var temp = new Array();
          var l = 0;
          for (var i = elizaLines.length - 1; i >= 0; i--) {
            l += 1 + Math.floor(elizaLines[i].length / displayCols);
            if (l >= displayRows) break;
            else temp.push(elizaLines[i]);
          }
          elizaLines = temp.reverse();
          f.e_display.value = elizaLines.join("\n");
        } else if (elizaLines.length == 0) {
          // no input and no saved lines -> output initial
          var initial = "Coach Creed: " + eliza.getInitial();
          elizaLines.push(initial);
          f.e_display.value = initial + "\n";
        }
        f.e_input.value = "";
        f.e_input.focus();
      }

      //-->
    </script>
    <link rel="stylesheet" href="stylesheet/styles.css" />
  </head>

  <body
    TOPMARGIN="0"
    LEFTMARGIN="0"
    RIGHTMARGIN="0"
    BOTTOMMARGIN="0"
    MARGINHEIGHT="0"
    MARGINWIDTH="0"
    style="border: 0"
    onload="window.setTimeout('elizaReset()',100)"
  >
    <div id="container">
      <img id="top" src="img/starBanner.jpg" />
      <h1>
        Meet your Personal Coach <br />
        Apollo Creed
      </h1>
      <img id="creed" src="img/creed.jpg" />
      <div id="chatbox">
        <center>
          <table border="0" cellspacing="10" cellpadding="0">
            <form name="e_form" onsubmit="elizaStep();return false">
              <tr>
                <td colspan="2">
                  <textarea
                    name="e_display"
                    cols="65"
                    rows="25"
                    readonly
                  ></textarea>
                </td>
              </tr>
              <tr valign="middle">
                <td><input type="text" name="e_input" size="50" /></td>
                <td align="right">
                  <input
                    class="button"
                    type="submit"
                    value="&nbsp;Talk&nbsp;"
                  />
                  <input
                    class="button"
                    type="reset"
                    value="Reset"
                    onClick="window.setTimeout('elizaReset()',100)"
                  />
                </td>
              </tr>
            </form>
          </table>
        </center>
      </div>
      <div id="link">
        <a href="https://chatgpt.com/share/682625f6-12cc-8010-8cc0-e33ef5fa6595"
          >Chat-GPT Discussion and Integration</a
        >
      </div>
      <img id="bottom" src="img/starBanner.jpg" />
    </div>
  </body>
</html>
